; Main unit: the car's connectivity module (replaces the Android app)
;
; Build and upload from VS Code with the PlatformIO extension:
;   PlatformIO sidebar > esp32dev > Upload, then Monitor
;
; esp32dev is the ordinary ESP32 DevKit (WROOM-32), and is the default.
; esp32-s3 is the ESP32-S3 DevKitC-1. The pins for each are in config.h.
;
; The platform below is pioarduino, a community build of PlatformIO's ESP32
; support that uses Arduino core 3.0.7. The code is written for that core.

[platformio]
default_envs = esp32dev

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Show what you type in the monitor (for the cal, north... commands)
monitor_echo = yes
build_flags =
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    links2004/WebSockets@2.6.1
    bblanchon/ArduinoJson@7.2.1
    mikalhart/TinyGPSPlus@1.1.0
    adafruit/Adafruit BNO08x@1.2.5
    adafruit/Adafruit BNO055@1.6.4

[env:esp32dev]
board = esp32dev

[env:esp32-s3]
board = esp32-s3-devkitc-1
