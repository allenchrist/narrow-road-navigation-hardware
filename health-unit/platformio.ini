; Health unit: fuel level and battery readings, on its own ESP32
;
; Build and upload from VS Code with the PlatformIO extension:
;   PlatformIO sidebar > health-unit > esp32dev > Upload, then Monitor
;
; The platform below is pioarduino, a community build of PlatformIO's ESP32
; support that uses Arduino core 3.0.7, the same as the main unit.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Show what you type in the monitor (for the empty, full... commands)
monitor_echo = yes
build_flags =
    -DCORE_DEBUG_LEVEL=1
