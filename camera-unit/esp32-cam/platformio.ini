; Camera unit on an ESP32-CAM (AI-Thinker board, OV2640 camera)
;
; The ESP32-CAM has no USB port: upload through an "ESP32-CAM-MB" USB board,
; or a USB-serial adapter with GPIO0 joined to GND while it resets.
;
; The platform below is pioarduino, a community build of PlatformIO's ESP32
; support that uses Arduino core 3.0.7. The code is written for that core.

[env:esp32cam]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32cam
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
