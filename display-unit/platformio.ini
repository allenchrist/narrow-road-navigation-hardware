; Display unit: the car screen (replaces the web dashboard)
;
; Board: 5-inch 800x480 ESP32-S3 "ESP32-8048S050" (16 MB flash, 8 MB PSRAM).
; Pins are in include/board.h.
;
; The platform below is pioarduino, a community build of PlatformIO's ESP32
; support that uses Arduino core 3.0.7. The code is written for that core.

[env:esp32-8048s050]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    ; vehicles:update messages can be bigger than the library's 15 KB default
    -DWEBSOCKETS_MAX_DATA_SIZE=262144
    -DCORE_DEBUG_LEVEL=1
; lib/WebSockets is a local copy of arduinoWebSockets with that limit adjustable
lib_deps =
    bblanchon/ArduinoJson@7.2.1
    lvgl/lvgl@8.3.11
    moononournation/GFX Library for Arduino@1.5.0
    tamctec/TAMC_GT911@1.0.2
